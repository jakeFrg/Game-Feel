<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game Feel: Combate por Turnos (Sesiones 1 y 2)</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Cuadro negro donde se dibuja el combate -->
  <canvas id="escena" width="720" height="420"></canvas>

  <!-- Mensaje del combate -->
  <p id="mensaje">¡Combate listo! Elige una acción.</p>

  <!-- Acciones del jugador -->
  <div class="controles">
    <button data-ataque="placaje">⚔️ Placaje (Normal)</button>
    <button data-ataque="llamas">🔥 Lanzallamas (Fuego)</button>
    <button data-ataque="chispa">⚡ Chispa (Eléctrico)</button>
    <button id="reiniciar" class="secundario">🔄 Reiniciar</button>
  </div>

  <!-- Capas y retos (se pueden activar o desactivar) -->
  <div class="controles">
    <label><input type="checkbox" id="capa1" checked> Capa 1: Squash &amp; Stretch + Shake</label>
    <label><input type="checkbox" id="capa2" checked> Capa 2: Tinte de daño</label>
    <label><input type="checkbox" id="capa3" checked> Capa 3: Cámara y destello</label>
    <label><input type="checkbox" id="capa4" checked> Capa 4: Sonido (SFX)</label>
    <label><input type="checkbox" id="reto1" checked> Reto 1: Hitstop</label>
    <label><input type="checkbox" id="reto2" checked> Reto 2: Ventaja elemental</label>
  </div>

  <!-- Los módulos ES requieren servidor local (Live Server o: python -m http.server) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
